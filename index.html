<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="hero">
    <div class="overlay">
      <h1>Practice page</h1>
      <nav>
        <ul class="nav-menu">
          <li><a href="#home">Home</a></li>
          <li><a href="#features">Features</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="section home">
      <p id="description">This paragraph text will change dynamically.</p>
      <button id="change-text-btn">Change Text</button>
    </section>

    <section id="features" class="section features">
      <div class="button-group">
        <button id="change-style-btn">Change Background</button>
        <button id="toggle-element-btn">Toggle Info</button>
      </div>
      <aside id="extra-element" class="info-box">This content is toggled by JavaScript.</aside>
    </section>

    <section id="contact" class="section contact">
      <h2>Contact Us</h2>
      <form id="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="4" required></textarea>
        </div>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 joakim</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
